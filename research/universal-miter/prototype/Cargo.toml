[package]
name = "universal-miter-prototype"
description = "Isolated PlanarSweep2 research prototype"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Kernel integration (input preprocessing and the NURBS surface builder).
# Off by default: the Level A mathematics builds without the kernel.
solidcore = ["dep:solidcore"]

[dependencies]
solidcore = { path = "../../../crates/solidcore", optional = true }

[[test]]
name = "gate0"
path = "tests/gate0.rs"
required-features = ["solidcore"]

[[test]]
name = "direct_shell"
path = "tests/direct_shell.rs"
required-features = ["solidcore"]

[lints]
workspace = true

[[test]]
name = "direct_joint"
path = "tests/direct_joint.rs"
required-features = ["solidcore"]

[[test]]
name = "direct_exact"
path = "tests/direct_exact.rs"
required-features = ["solidcore"]

[[test]]
name = "source_selection"
path = "tests/source_selection.rs"
required-features = ["solidcore"]

[[test]]
name = "planar_pipeline"
path = "tests/planar_pipeline.rs"
required-features = ["solidcore"]

[[test]]
name = "torus_audit"
path = "tests/torus_audit.rs"
required-features = ["solidcore"]

[[test]]
name = "arc_arc_oracle"
path = "tests/arc_arc_oracle.rs"
required-features = ["solidcore"]
